
  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija & China 2-Way Talk</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:15px;text-align:center}
.app{max-width:520px;margin:15px auto;background:white;padding:20px;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{font-size:20px}
.btn{border:none;border-radius:50px;padding:16px 20px;font-size:16px;cursor:pointer;margin:8px;width:90%;font-weight:bold}
.btn-en{background:#111;color:white}
.btn-zh{background:#c00;color:white}
.box{text-align:left;background:#f7f7f7;padding:12px;border-radius:12px;margin-top:12px;min-height:50px}
.label{font-weight:bold;font-size:12px;color:#666}
#english{font-size:18px}
#chinese{font-size:20px}
.market{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px}
.market button{background:#fff3cd;border:1px solid #ffe69c;font-size:13px;padding:7px 10px;margin:4px;border-radius:20px}
</style>
</head>
<body>
<div class="app">
<h1>🇳🇬 ↔ 🇨🇳 Naija-China Talk</h1>
<p style="font-size:13px;color:#666">2-Way Market Translator</p>

<div class="box"><div class="label">English / Pidgin</div><div id="english">Waiting...</div></div>
<div class="box"><div class="label">Chinese 中文</div><div id="chinese">等待...</div></div>

<button class="btn btn-en" id="btnEn">🎤 Speak English / Pidgin</button>
<button class="btn btn-zh" id="btnZh">🎤 中国人说中文</button>

<div style="margin-top:15px">
<button onclick="speak('en')" style="background:#e0e0e0;border-radius:20px;padding:10px 15px;border:none">🔊 Speak English</button>
<button onclick="speak('zh')" style="background:#e0e0e0;border-radius:20px;padding:10px 15px;border:none">🔊 说中文</button>
</div>

<div class="market">
<button onclick="quick('en','How much is this?')">How much?</button>
<button onclick="quick('en','Too expensive, reduce price')">Reduce price</button>
<button onclick="quick('en','Last price?')">Last price</button>
<button onclick="quick('zh','这个多少钱？')">这个多少钱？</button>
<button onclick="quick('zh','太贵了')">太贵了</button>
</div>
</div>

<script>
const enDiv = document.getElementById("english");
const zhDiv = document.getElementById("chinese");
let currentMode = "en";

async function translate(text, from, to){
  try{
    if(from==="en"){
      text=text.toLowerCase().replace("how much be","how much is").replace("abeg","please");
    }
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res=await fetch(url);
    const data=await res.json();
    return data.responseData.translatedText;
  }catch(e){return "Network error";}
}

async function quick(from, text){
  if(from==="en"){
    enDiv.textContent=text;
    zhDiv.textContent="Translating...";
    zhDiv.textContent=await translate(text,"en","zh-CN");
    speak('zh');
  }else{
    zhDiv.textContent=text;
    enDiv.textContent="Translating...";
    enDiv.textContent=await translate(text,"zh-CN","en");
    speak('en');
  }
}

function speak(lang){
  let t = lang==="zh"? zhDiv.textContent : enDiv.textContent;
  if(!t || t.includes("Waiting") || t.includes("等待") || t.includes("Translating")) return;
  const u=new SpeechSynthesisUtterance(t);
  u.lang= lang==="zh"? "zh-CN" : "en-NG";
  speechSynthesis.speak(u);
}

// Speech Recognition Setup
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ enDiv.textContent="Please open in Chrome browser"; }

const recEn = SR? new SR() : null;
const recZh = SR? new SR() : null;

if(recEn){
 recEn.lang="en-NG";
 recEn.onstart=()=> document.getElementById("btnEn").textContent="🎤 Listening English...";
 recEn.onresult= async (e)=>{
   const txt=e.results[0][0].transcript;
   enDiv.textContent=txt;
   zhDiv.textContent="Translating...";
   zhDiv.textContent=await translate(txt,"en","zh-CN");
   speak('zh');
   document.getElementById("btnEn").textContent="🎤 Speak English / Pidgin";
 };
 recEn.onend=()=> document.getElementById("btnEn").textContent="🎤 Speak English / Pidgin";
}

if(recZh){
 recZh.lang="zh-CN";
 recZh.onstart=()=> document.getElementById("btnZh").textContent="🎤 正在听中文...";
 recZh.onresult= async (e)=>{
   const txt=e.results[0][0].transcript;
   zhDiv.textContent=txt;
   enDiv.textContent="Translating...";
   enDiv.textContent=await translate(txt,"zh-CN","en");
   speak('en');
   document.getElementById("btnZh").textContent="🎤 中国人说中文";
 };
 recZh.onend=()=> document.getElementById("btnZh").textContent="🎤 中国人说中文";
}

document.getElementById("btnEn").onclick=()=> recEn && recEn.start();
document.getElementById("btnZh").onclick=()=> recZh && recZh.start();
</script>
</body>
</html>
